<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Cave — music player</title>
<meta name="description" content="A personal listening room powered by JioSaavn.">
<meta name="theme-color" content="#5ee7ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="/" class="nav-brand"><span class="dot"></span>Ghost Cave</a>
    <div class="nav-ctas"><span class="nav-tag">Source · JioSaavn</span></div>
  </div>
</nav>

<section class="music-shell wrap">
  <div class="music-panel">

    <aside class="music-sidebar">
      <nav class="music-sidebar-nav">
        <a href="#" class="music-sidebar-link active" data-panel="search">
          <span class="music-icon">🔎</span> Search
        </a>
        <a href="#" class="music-sidebar-link" data-panel="queue">
          <span class="music-icon">🎶</span> Queue
          <span class="music-count-tag" id="queue-count">0</span>
        </a>
      </nav>
    </aside>

    <main class="music-main">

      <div class="music-nowplaying-card" id="now-playing">
        <div class="music-nowplaying-art"><img id="np-artwork" alt="" hidden></div>
        <div class="music-nowplaying-info">
          <div class="music-nowplaying-title" id="np-title">Nothing playing yet</div>
          <div class="music-nowplaying-sub" id="np-author">Search for a song to get started</div>
          <div class="music-progress-row">
            <div class="music-progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="music-progress-fill" id="progress-fill"></div>
            </div>
            <span class="music-time" id="time-label">0:00 / 0:00</span>
          </div>
        </div>
        <div class="music-controls">
          <button class="music-ctrl-btn" id="prev-btn" title="Previous" aria-label="Previous" disabled>⏮</button>
          <button class="music-ctrl-btn music-ctrl-primary" id="play-btn" title="Play/Pause" aria-label="Play or pause" disabled>▶</button>
          <button class="music-ctrl-btn" id="next-btn" title="Next" aria-label="Next" disabled>⏭</button>
          <input class="music-volume" id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" title="Volume">
        </div>
      </div>

      <p class="music-toast" id="toast" hidden></p>

      <div id="panel-search" class="music-view">
        <form class="music-play-card" id="search-form">
          <input type="text" id="search-input" class="music-play-input" placeholder="Song, artist or album" autocomplete="off" aria-label="Search songs">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>

        <div class="music-queue-card">
          <ul class="music-queue-list" id="results">
            <li class="music-queue-empty">Search for something to start filling your queue.</li>
          </ul>
        </div>
      </div>

      <div id="panel-queue" class="music-view" hidden>
        <div class="music-queue-card">
          <div class="music-toolbar music-toolbar-tight">
            <h3>Queue</h3>
            <button class="btn btn-ghost btn-small" id="clear-btn" type="button">Clear</button>
          </div>
          <ul class="music-queue-list" id="queue-list">
            <li class="music-queue-empty">Your queue is empty.</li>
          </ul>
        </div>
      </div>

    </main>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-brand">Ghost Cave — personal listening room</div>
    <div class="footer-links"><span>Music via JioSaavn · for personal use</span></div>
  </div>
</footer>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
